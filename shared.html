<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#3A2924">
<title>Benny's Launch Control — Shared</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F3E8D0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0}.cloudbar{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:100;display:flex;gap:8px}.cloudbtn{width:48px;height:48px;border:1px solid #d7c7b0;border-radius:14px;background:#fff8eb;color:#3A2924;box-shadow:0 8px 24px #3a29242a;font-size:21px;font-weight:900;display:grid;place-items:center}.cloudbtn.connected{background:#78806A;color:white;border-color:#78806A}.cloudbtn.syncing{background:#C59A45;color:#3A2924;border-color:#C59A45}.cloudbtn.error{background:#B84E42;color:white;border-color:#B84E42}.cloudbtn.share{background:#3A2924;color:#F3E8D0;border-color:#3A2924;display:none}.cloudbtn.share.show{display:grid}.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);z-index:110;background:#3A2924;color:#fff8eb;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;max-width:82vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.overlay{position:fixed;inset:0;z-index:200;background:#3a292480;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.overlay.hidden{display:none}.panel{width:min(520px,100%);max-height:86dvh;overflow:auto;background:#F3E8D0;border:1px solid #d7c7b0;border-radius:20px;box-shadow:0 24px 70px #0005;padding:20px;color:#3A2924}.panel h2{font-family:Georgia,serif;font-size:27px;margin:0 0 6px}.panel p{color:#786960;font-size:12px;line-height:1.5;margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field span{font-size:11px;font-weight:900}.field input{width:100%;box-sizing:border-box;border:1px solid #d7c7b0;background:#fff8eb;border-radius:10px;padding:12px;font-size:16px;color:#3A2924}.hint{font-size:10px;color:#786960;line-height:1.4}.status{border:1px solid #d7c7b0;background:#fff8eb;border-radius:12px;padding:11px;font-size:11px;margin:13px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}.btn{border:1px solid #d7c7b0;background:#fff8eb;color:#3A2924;border-radius:10px;padding:10px 12px;font-weight:850}.btn.primary{background:#B84E42;border-color:#B84E42;color:white}.btn.dark{background:#3A2924;border-color:#3A2924;color:#F3E8D0}.btn.danger{color:#B84E42}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#e3d6c3;padding:5px 8px;font-size:10px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:#9a8a7d}.dot.ok{background:#78806A}.dot.busy{background:#C59A45}.dot.bad{background:#B84E42}@media(min-width:900px){.cloudbar{bottom:24px}.toast{bottom:82px}}
</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Benny's Launch Control"></iframe>
<div class="cloudbar"><button id="syncBtn" class="cloudbtn" aria-label="Shared sync" title="Shared sync">☁</button><button id="shareBtn" class="cloudbtn share" aria-label="Share workspace" title="Share workspace">↗</button></div>
<div id="toast" class="toast"></div>
<div id="modal" class="overlay hidden">
  <div class="panel">
    <div class="badge"><i id="statusDot" class="dot"></i><span id="statusText">Local only</span></div>
    <h2>Shared Launch Control</h2>
    <p>اربط النسخة المشتركة بقاعدة Benny’s. بعد الربط، أي تعديل يظهر لباقي الأجهزة تلقائيًا خلال ثوانٍ.</p>
    <label class="field"><span>Apps Script Web App URL / رابط المزامنة</span><input id="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label class="field"><span>Your name / اسمك</span><input id="name" maxlength="40" placeholder="Ahmed"></label>
    <label class="field"><span>Workspace key / مفتاح المشاركة</span><input id="key" maxlength="80"></label>
    <div class="hint">المفتاح يربط نفس مساحة العمل بين الأجهزة. لا تنشر رابط الدعوة للعامة؛ أي شخص يملك رابط الدعوة يستطيع تعديل البيانات.</div>
    <div id="detail" class="status">Not connected yet.</div>
    <div class="actions"><button id="disconnect" class="btn danger">Disconnect</button><button id="close" class="btn">Close</button><button id="copyInvite" class="btn dark">Share invite</button><button id="connect" class="btn primary">Connect & Sync</button></div>
  </div>
</div>
<script>
const CFG_KEY='bennys-shared-sync-v1';
const frame=document.getElementById('app'),modal=document.getElementById('modal'),syncBtn=document.getElementById('syncBtn'),shareBtn=document.getElementById('shareBtn');
const statusText=document.getElementById('statusText'),statusDot=document.getElementById('statusDot'),detail=document.getElementById('detail');
let cfg=loadCfg(),frameReady=false,syncReady=false,applying=false,remoteRevision=0,lastLocal='',saveTimer=null,pollTimer=null,lastMeta=null;
function randomKey(){const a=new Uint8Array(18);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function loadCfg(){let c={url:'',name:'',key:''};try{c={...c,...JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}}catch(e){}try{const p=new URLSearchParams(location.search),inv=p.get('invite');if(inv){const raw=decodeURIComponent(escape(atob(inv.replace(/-/g,'+').replace(/_/g,'/')))),x=JSON.parse(raw);if(x.u&&x.k){c.url=x.u;c.key=x.k;localStorage.setItem(CFG_KEY,JSON.stringify(c));history.replaceState({},'',location.pathname)}}}catch(e){}if(!c.key)c.key=randomKey();return c}
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}
function inviteToken(){const raw=unescape(encodeURIComponent(JSON.stringify({u:cfg.url,k:cfg.key})));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function inviteUrl(){return location.origin+location.pathname+'?invite='+inviteToken()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}
function setStatus(kind,text,extra=''){syncBtn.classList.remove('connected','syncing','error');statusDot.className='dot';if(kind==='ok'){syncBtn.classList.add('connected');statusDot.classList.add('ok')}else if(kind==='busy'){syncBtn.classList.add('syncing');statusDot.classList.add('busy')}else if(kind==='bad'){syncBtn.classList.add('error');statusDot.classList.add('bad')}statusText.textContent=text;syncBtn.title=text;detail.textContent=extra||text;shareBtn.classList.toggle('show',kind==='ok')}
function openModal(){document.getElementById('url').value=cfg.url||'';document.getElementById('name').value=cfg.name||'';document.getElementById('key').value=cfg.key||randomKey();modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function frameState(){if(!frameReady)return null;try{return JSON.parse(frame.contentWindow.eval('JSON.stringify(state)'))}catch(e){return null}}
function applyState(s){if(!frameReady||!s)return;try{applying=true;const raw=JSON.stringify(s);frame.contentWindow.eval('state='+raw+'; localStorage.setItem(STORAGE,JSON.stringify(state)); renderAll();');lastLocal=raw;setTimeout(()=>applying=false,400)}catch(e){applying=false;setStatus('bad','Sync error','Could not apply shared data to the app.') }}
function jsonp(params){return new Promise((resolve,reject)=>{if(!cfg.url)return reject(new Error('No URL'));const cb='__bennys_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>{cleanup();reject(new Error('Timeout'))},9000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};const q=new URLSearchParams({...params,callback:cb,key:cfg.key,_:Date.now()});s.src=cfg.url+(cfg.url.includes('?')?'&':'?')+q.toString();s.onerror=()=>{cleanup();reject(new Error('Network error'))};document.head.appendChild(s)})}
async function loadRemote(initial=false){if(!cfg.url||!cfg.key||!cfg.name||!frameReady)return;try{if(initial)setStatus('busy','Connecting…','Checking the shared workspace…');const d=await jsonp({action:'load'});if(!d||d.ok===false){setStatus('bad','Sync blocked',d?.error||'Could not read the shared workspace.');return}if(d.uninitialized){syncReady=true;remoteRevision=0;setStatus('busy','Initializing…','Creating the shared workspace from this device…');await pushRemote(true);return}syncReady=true;if(Number(d.revision||0)>remoteRevision&&d.state&&Object.keys(d.state).length){remoteRevision=Number(d.revision||0);lastMeta=d;applyState(d.state)}const who=d.updatedBy||'—',when=d.updatedAt?new Date(d.updatedAt).toLocaleString():'—';setStatus('ok','Shared · synced',`Revision ${d.revision||0} · Last edit: ${who} · ${when}`)}catch(e){setStatus('bad','Offline / sync error',e.message||'Could not reach Apps Script.')}}
async function pushRemote(force=false){if(!cfg.url||!cfg.key||!cfg.name||!frameReady||(!syncReady&&!force))return;const s=frameState();if(!s)return;setStatus('busy','Syncing…','Uploading the latest changes…');try{await fetch(cfg.url,{method:'POST',mode:'no-cors',body:new URLSearchParams({action:'save',key:cfg.key,updatedBy:cfg.name,state:JSON.stringify(s)})});setTimeout(()=>loadRemote(false),900)}catch(e){setStatus('bad','Sync failed',e.message||'Could not save changes.')}}
function queuePush(){if(applying||!syncReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>pushRemote(false),650)}
function startSync(){clearInterval(pollTimer);syncReady=false;if(!cfg.url||!cfg.key||!cfg.name){setStatus('','Local only','Add the Apps Script URL and your name to enable shared sync.');if(cfg.url||cfg.key)openModal();return}loadRemote(true);pollTimer=setInterval(()=>loadRemote(false),6000)}
function watchLocal(){setInterval(()=>{if(!frameReady)return;const s=frameState();if(!s)return;const raw=JSON.stringify(s);if(!lastLocal){lastLocal=raw;return}if(raw!==lastLocal){lastLocal=raw;if(!applying)queuePush()}},900)}
frame.addEventListener('load',()=>{frameReady=true;const s=frameState();lastLocal=s?JSON.stringify(s):'';startSync()});
syncBtn.onclick=openModal;shareBtn.onclick=shareInvite;document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.getElementById('connect').onclick=()=>{const u=document.getElementById('url').value.trim(),n=document.getElementById('name').value.trim(),k=document.getElementById('key').value.trim();if(!u||!/\/exec(?:\?|$)/.test(u))return alert('Paste the deployed Apps Script Web App URL ending in /exec');if(!n)return alert('Add your name first.');if(!k)return alert('Add a workspace key.');cfg={url:u,name:n,key:k};saveCfg();closeModal();startSync();toast('Shared sync connected')};
document.getElementById('disconnect').onclick=()=>{if(!confirm('Disconnect shared sync on this device?'))return;cfg={url:'',name:'',key:randomKey()};saveCfg();syncReady=false;clearInterval(pollTimer);setStatus('','Local only','This device is no longer connected to the shared workspace.');closeModal();toast('Disconnected')};
async function shareInvite(){if(!cfg.url)return openModal();const url=inviteUrl(),data={title:"Benny's Launch Control",text:"Open Benny's shared Launch Control",url};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);toast('Invite link copied')}}catch(e){}}
document.getElementById('copyInvite').onclick=shareInvite;
setStatus('','Local only','Waiting for shared sync setup.');watchLocal();
</script>
</body>
</html>
